openapi: 3.0.1
info:
  title: EduSync User Service
  description: Authenticated caller profile access (X-User-Id derived from a verified
    gateway JWT).
  version: 0.1.0
servers:
- url: http://localhost:9002
  description: Generated server url
paths:
  /users/me:
    get:
      tags:
      - user-controller
      operationId: me
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      - name: X-User-Email
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Bad Request (missing X-User-Id header)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - user-controller
      operationId: updateMe
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Bad Request (missing X-User-Id header, or blank firstName/lastName)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/health:
    get:
      tags:
      - user-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
components:
  schemas:
    UpdateProfileRequest:
      required:
      - firstName
      - lastName
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
    UserProfileResponse:
      description: The caller's own persisted profile. Returned by both GET and
        PATCH /users/me so a client can always see the real, saved state.
      type: object
      properties:
        id:
          type: string
          description: The caller's userId, exactly as asserted by the gateway's
            X-User-Id header.
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Real JPA optimistic-locking row version (not a random
            per-response value).
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
