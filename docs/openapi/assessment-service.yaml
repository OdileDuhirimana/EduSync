openapi: 3.0.1
info:
  title: EduSync Assessment Service
  description: Quiz/assignment authoring and timed assessment sessions.
  version: 0.1.0
servers:
- url: http://localhost:9005
  description: Generated server url
paths:
  /assessments:
    post:
      tags:
      - assessment-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /assessments/{id}/start:
    post:
      tags:
      - assessment-controller
      operationId: start
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /assessments/{id}:
    get:
      tags:
      - assessment-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /assessments/health:
    get:
      tags:
      - assessment-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
components:
  schemas:
    CreateAssessmentRequest:
      required:
      - courseId
      - title
      type: object
      properties:
        courseId:
          type: string
        title:
          type: string
        type:
          type: string
