# Test-only datasource: a uniquely named in-memory H2 instance per JVM run,
# matching course-service's test profile. Flyway still runs against it, so
# tests exercise the real migration path, not a Hibernate-generated schema.
spring:
  datasource:
    url: jdbc:h2:mem:user-service-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
