server:
  port: ${PORT:9004}
spring:
  application:
    name: enrollment-service
  # WHY a file-based H2 database rather than in-memory (`mem:`) for the
  # default/dev profile: an in-memory DB would still lose all data on every
  # restart, which is exactly the SEC-01/DB-01 defect this migration fixes.
  # `./data/enrollment-service` persists to disk between restarts locally. The
  # test profile below overrides this back to an isolated in-memory instance
  # per test run, which is the correct behavior for tests.
  datasource:
    url: ${ENROLLMENT_DB_URL:jdbc:h2:file:./data/enrollment-service;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${ENROLLMENT_DB_USER:sa}
    password: ${ENROLLMENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # WHY "validate" and not "update"/"create": the schema is owned by
      # Flyway migrations (see db/migration/V1__create_enrollments_table.sql).
      # Hibernate is only allowed to confirm the entity mapping matches the
      # migrated schema, never to mutate it — this prevents silent, undocumented
      # schema drift in any environment.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
# WHY this points directly at course-service rather than routing back through
# the api-gateway: this is a service-to-service call inside the trusted
# network (see README "Security Model" — only the gateway is meant to be
# publicly reachable), not a caller-facing request, so it uses the same
# direct host:port addressing api-gateway itself uses for routing
# (COURSE_SERVICE_HOSTPORT in render.yaml), not the public gateway URL.
services:
  course:
    base-url: ${COURSE_SERVICE_URL:http://${COURSE_SERVICE_HOSTPORT:localhost:9003}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
